<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ウェルス簡易診断｜美容ゼミ</title>
<style>
:root{--green:#1F3B33;--paper:#F7F3EA;--orange:#C9671E;--mid:#2f7d58;--red:#c8322a;--blue:#2c6fb3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--green);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:8px 0 4px}
.sub{font-size:14px;opacity:.75;margin:0 0 18px}
.card{background:#fffdf8;border:2px solid #bccdc1;border-radius:16px;padding:16px;margin:14px 0}
label{display:block;font-weight:800;margin-bottom:6px}
input[type=text]{width:100%;font-size:18px;padding:12px;border:2px solid #9fb8a9;border-radius:12px;background:#fff}
.q{font-weight:900;font-size:18px;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:700;padding:12px 14px;margin:8px 0;border-radius:12px;border:2px solid #bccdc1;background:#fff;color:var(--green);cursor:pointer}
.opt b{color:var(--orange);margin-right:8px}
.opt.on{border-color:var(--mid);background:#e3f0e4}
button.main{width:100%;font:inherit;font-size:19px;font-weight:900;padding:16px;border:0;border-radius:14px;background:var(--green);color:#fff;margin-top:10px;cursor:pointer}
button.main:disabled{opacity:.4}
.prog{font-size:14px;font-weight:800;opacity:.7}
.res h2{font-size:28px;margin:4px 0}
.tag{display:inline-block;color:#fff;border-radius:10px;padding:2px 12px;font-weight:900;font-size:15px}
.bar{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:6px 0}
.bar span.l{width:92px}
.bar i{display:block;height:14px;border-radius:7px}
.note{font-size:13px;opacity:.7}
.sec{font-weight:900;margin:14px 0 4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <p class="prog">日本医専 美容ゼミ 第2回</p>
  <h1>ウェルス簡易診断</h1>
  <div class="card" style="font-size:14px"><b>ウェルスダイナミクスとは？</b><br>ロジャー・ハミルトンさんが作った、自分の強みに合った「成功の道」を見つけるための考え方。4つのエネルギー（ダイナモ＝春・ブレイズ＝夏・テンポ＝秋・スチール＝冬）と8つのタイプがあります。</div>
  <p class="sub">6問・約1分。直感で答えてください。結果は、ゼミづくりと進路の相談にだけ使います。ほかの学生には見せません。</p>

  <section id="start" class="card">
    <label for="name">お名前（フルネーム）</label>
    <input id="name" type="text" autocomplete="name" placeholder="例：日本 花子">
    <button class="main" id="go" disabled>はじめる</button>
  </section>

  <section id="quiz" hidden>
    <p class="prog" id="count"></p>
    <div class="card"><p class="q" id="qtext"></p><div id="opts"></div></div>
  </section>

  <section id="result" class="res" hidden></section>
  <p class="note">※ウェルスダイナミクス（ロジャー・ハミルトン氏）の考え方をもとにした、このゼミのためのオリジナル簡易版です。公式の診断ではありません。</p>
</main>
<script>
const FORM='https://docs.google.com/forms/d/e/1FAIpQLSeyGJ6fUUs4TD_C3ypNvveKLsZsZJNN7GPQeMnOVhf2Kz9dTw/formResponse';
const Q=[
 ['休みの日、気づくとしていることは？','新しいことを思いつく','だれかと会っている','その場の流れを楽しむ','予定や持ち物を整える'],
 ['グループ作業での、自分の役は？','アイデアを出す','みんなを盛り上げる','みんなを手伝い、調整する','段取り・記録をする'],
 ['いちばん苦手なのは？','同じことのくり返し','ひとりで黙々とやる','急な大きな変更','根拠のない話'],
 ['言われてうれしいのは？','「発想がすごいね」','「一緒にいると楽しい」','「気がきくね」','「正確だね」'],
 ['施術者になったら、どうなりたい？','新しい施術法を生み出す','ファンがたくさんいる先生','目の前の人にとことん合わせる','結果を数字で示せる先生'],
 ['買い物のとき、近いのは？','新商品にひかれる','人のおすすめで買う','実際にさわって試す','くらべて調べてから買う']];
const EN={A:['ダイナモ','アイデア・ひらめき','#c9671e'],B:['ブレイズ','人・つながり','#c8322a'],C:['テンポ','五感・タイミング','#2f7d58'],D:['スチール','データ・しくみ','#2c6fb3']};
const FAMOUS={A:'トーマス・エジソン（発明王）、スティーブ・ジョブズ（Apple）',AB:'オプラ・ウィンフリー（司会者）、マーサ・スチュワート（暮らしの達人）',B:'ジャック・ウェルチ（GE元CEO）、スティーブ・バルマー（Microsoft元CEO）',BC:'デヴィッド・ゲフィン（ドリームワークス創業）',C:'ジョージ・ソロス（投資家）、ピーター・リンチ（投資家）',CD:'ウォーレン・バフェット（投資家）',D:'ジョン・D・ロックフェラー（石油王）、アンドリュー・カーネギー（鉄鋼王）',DA:'ヘンリー・フォード（自動車）、レイ・クロック（マクドナルドを大きくした人）'};
const PR={
 A:['クリエイター','アイデアを生み出し、新しいことを始めるのが得意。','新しいメニューや、自分だけの施術を生み出す。開業や商品づくりで力を出しやすい。','始めたことを最後まで回すのは、仕組みや仲間に任せると伸びる。'],
 AB:['スター','自分が前に出ることで、人を引きつけるのが得意。','「この先生に診てほしい」と指名される。SNSやセミナーで発信する。','細かい管理や事務は、得意な人と組むと伸びる。'],
 B:['サポーター','人を応援し、チームを動かすのが得意。','お客様との信頼づくり、スタッフをまとめるリーダー役。','ひとりで抱え込みすぎないように。'],
 BC:['ディールメーカー','人と人をつなぎ、ちょうどいいタイミングで話をまとめるのが得意。','紹介や、病院・ジムとの連携。お客様に合った提案。','やることが広がりすぎないように、軸を決めておく。'],
 C:['トレーダー','その場の感覚で、ちょうどいい加減を見つけるのが得意。','目の前の体の変化に合わせる、現場の職人。接客。','大きな方針づくりは、人と相談しながら。'],
 CD:['アキュムレーター','コツコツ積み上げ、確実に続けるのが得意。','リピーターを大切にし、記録で信頼を積み上げる。','新しいことに慣れるまで、少し時間をもらう。'],
 D:['ロード','データと細かいところを管理し、仕組みで回すのが得意。','評価や数字で結果を示す。院の運営・管理。','人前に出るのは、得意な人と組めばOK。'],
 DA:['メカニック','仕組みを見直して、もっとよくするのが得意。','施術の手順づくり・マニュアル化。教える側。','完璧を求めすぎないように。']};
const JP={A:'本田宗一郎',AB:'明石家さんま',B:'松下幸之助',BC:'孫正義',C:'是川銀蔵（相場師）',CD:'二宮尊徳',D:'稲盛和夫',DA:'大野耐一（トヨタ生産方式）'};
const WKEY={"A": {"job": "より良い製品を作る", "max": "新商品・戦略・アイデア（もやっとしたものを作り上げる）", "cat": "メカニック（形にしてくれる）・ディールメーカー（適材適所につなげてくれる）"}, "AB": {"job": "独自のアイデンティティを確立する", "max": "「私は何者か」の定義・研磨・伝達", "cat": "クリエイター（物を持つ）・ディールメーカー（広げてくれる）"}, "B": {"job": "チームを率いて目標達成をサポートする", "max": "貢献の場を特定し、発展させる", "cat": "クリエイター・メカニック（物・システムを持つ）"}, "BC": {"job": "適切な時に、適切な人をつなげる", "max": "取引・人材の選別、交渉を取り仕切る（交渉の場にいる）", "cat": "クリエイター・メカニック（物を持つ人と組むと一気に伸びる）"}, "C": {"job": "安く買って高く売る（市場・チャンスを嗅覚で分かる）", "max": "価値の構造、取引のタイミングの分析", "cat": "サポーター（人を見つける）・メカニック（物を持つ）"}, "CD": {"job": "いずれ価値が上がる資産を選ぶ（技術・会社も資産）", "max": "内部システムをどんどん構築する", "cat": "サポーター・ディールメーカー・メカニック・クリエイター"}, "D": {"job": "お金を生み出す権利を支配する", "max": "資産の選択と運営、リターンの計算とコントロール（知識が要る）", "cat": "サポーター・ディールメーカー（人に関わる人）"}, "DA": {"job": "より良いシステムを編み出す", "max": "システム・プロセスの改善とテスト、性能の測定と評価（数字にこだわる）", "cat": "クリエイター（形にする元）・サポーター・ディールメーカー（広げてくれる）"}};
const ORDER='ABCD';
let name='', ans=[], i=0;
const $=id=>document.getElementById(id);
$('name').addEventListener('input',e=>{$('go').disabled=e.target.value.trim().length<2;});
$('go').onclick=()=>{name=$('name').value.trim(); $('start').hidden=true; $('quiz').hidden=false; show();};
function show(){
  const q=Q[i]; $('count').textContent=`Q${i+1} / ${Q.length}`; $('qtext').textContent=q[0];
  $('opts').innerHTML=['A','B','C','D'].map((L,k)=>`<button class="opt" data-l="${L}"><b>${L}</b>${q[k+1]}</button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{b.classList.add('on'); ans[i]=b.dataset.l; setTimeout(()=>{i++; i<Q.length?show():finish();},180);});
}
function profileOf(c){
  const sorted=[...ORDER].sort((a,b)=>c[b]-c[a]||ORDER.indexOf(a)-ORDER.indexOf(b));
  const t=sorted[0], s=sorted[1];
  const pair=[t+s,s+t].find(k=>PR[k]);
  return (c[s]>=2 && pair)?pair:t;
}
function finish(){
  const c={A:0,B:0,C:0,D:0}; ans.forEach(a=>c[a]++);
  const key=profileOf(c), p=PR[key], top=[...ORDER].sort((x,y)=>c[y]-c[x]||ORDER.indexOf(x)-ORDER.indexOf(y))[0];
  const part=new Date().getHours()<16?'昼':'夜';
  try{ fetch(FORM,{method:'POST',mode:'no-cors',body:new URLSearchParams({'entry.1700560886':`ウェルス｜${name}｜${part}｜${ans.join('')}｜${EN[top][0]}｜${p[0]}`})}).catch(()=>{}); }catch(e){}
  try{ localStorage.setItem('wealth-result',JSON.stringify({name,ans,key})); }catch(e){}
  $('quiz').hidden=true; const r=$('result'); r.hidden=false;
  const bars=ORDER.split('').map(L=>`<div class="bar"><span class="l">${L} ${EN[L][0]}</span><i style="width:${20+c[L]*36}px;background:${EN[L][2]}"></i><span>${c[L]}</span></div>`).join('');
  r.innerHTML=`<div class="card"><p class="prog">${name} さんのタイプ</p>
   <h2>${p[0]}</h2><span class="tag" style="background:${EN[top][2]}">${EN[top][0]}：${EN[top][1]}</span>
   <p class="sec">どんな人？</p><p>${p[1]}</p>
   <p class="sec">施術者としての活躍の道</p><p>${p[2]}</p>
   <p class="sec">伸ばすヒント</p><p>${p[3]}</p>
   <p class="sec">仕事の鍵</p><p>${WKEY[key].job}</p>
   <p class="sec">最大化の鍵</p><p>${WKEY[key].max}</p>
   <p class="sec">組むと伸びる相手</p><p>${WKEY[key].cat}</p>
   <p class="sec">同じタイプの有名人</p><p>${FAMOUS[key]}</p><p class="note">日本人なら（イメージ）：${JP[key]}</p></div>
   <div class="card"><p class="sec" style="margin-top:0">あなたのエネルギーのバランス</p>${bars}
   <p class="note">いちばん多いエネルギーと、となりあう2番目の組み合わせでタイプが決まります。</p></div>
   <p style="font-weight:900;text-align:center">この画面のまま、前のスライドを見てね</p>`;
}
</script>
</body>
</html>
